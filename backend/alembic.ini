[alembic]
script_location = %(here)s/alembic_migrations
sqlalchemy.url = postgresql+psycopg://floodlens:FloodlenPass123@floodlens-ai-floodlensdb-xia8dz2hw3om.cstm08qqy3w3.us-east-1.rds.amazonaws.com:5432/floodlens

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
