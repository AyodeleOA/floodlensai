AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FloodLens AI — API Gateway + Lambda backend infrastructure

Parameters:
  AppEnv:
    Type: String
    Default: dev
    AllowedValues: [local, dev, demo, prod]
    Description: Deployment environment (local, dev, demo, prod)

  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: >
      The Amplify Hosting frontend URL for CORS.
      In production, set to your Amplify domain (e.g. https://main.d12345.amplifyapp.com).
      This must match exactly — CORS will only allow this origin.

  ApiGatewayStage:
    Type: String
    Default: prod
    Description: API Gateway stage name (prod, demo, dev)

  DBName:
    Type: String
    Default: floodlens
    Description: PostgreSQL database name
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,62}$'

  DBUser:
    Type: String
    Default: floodlens
    Description: PostgreSQL master username
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'

  DBPassword:
    Type: String
    NoEcho: true
    Description: PostgreSQL master password (8-41 alphanumeric characters, change in production)
    MinLength: 8
    MaxLength: 41
    AllowedPattern: '^[A-Za-z0-9]{8,41}$'
    ConstraintDescription: Must contain 8-41 alphanumeric characters.

  AWSRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for deployment

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        APP_ENV: !Ref AppEnv
        API_V1_PREFIX: /api/v1
        FRONTEND_ORIGIN: !Ref FrontendOrigin

Resources:
  # --- API Gateway HTTP API ---
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: floodlens-api
      ProtocolType: HTTP
      Description: FloodLens AI HTTP API
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, X-User-Role, X-User-Id, X-User-Email, X-User-Organisation]
        MaxAge: 3600

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref ApiGatewayStage
      AutoDeploy: true

  # --- Lambda: FastAPI main handler ---
  FloodLensApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend
      Handler: app.lambda_handler.handler
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DATABASE_URL: !Sub 'postgresql+psycopg://${DBUser}:${DBPassword}@${FloodLensDB.Endpoint.Address}:${FloodLensDB.Endpoint.Port}/${DBName}'
          S3_MEDIA_BUCKET: !Ref MediaBucket
          AI_PROVIDER_MODE: mock
          DEMO_MODE: 'true'
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MediaAnalysisQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: '*'
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        HealthLive:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health/live
            Method: GET
        HealthReady:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health/ready
            Method: GET

  # --- SQS: Media Analysis Queue ---
  MediaAnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: floodlens-media-analysis
      VisibilityTimeout: 730
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MediaAnalysisDLQ.Arn
        maxReceiveCount: 3

  MediaAnalysisDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: floodlens-media-analysis-dlq

  # --- Lambda: SQS Worker ---
  FloodLensWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend
      Handler: app.lambda_handler.sqs_worker_handler
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          DATABASE_URL: !Sub 'postgresql+psycopg://${DBUser}:${DBPassword}@${FloodLensDB.Endpoint.Address}:${FloodLensDB.Endpoint.Port}/${DBName}'
          S3_MEDIA_BUCKET: !Ref MediaBucket
          AI_PROVIDER_MODE: mock
          DEMO_MODE: 'true'
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: '*'
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MediaAnalysisQueue.Arn
            BatchSize: 5
            MaximumBatchingWindowInSeconds: 10

  # --- S3 Bucket: Media ---
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'floodlens-media-${AWS::Region}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --- RDS PostgreSQL ---
  FloodLensDB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      DBName: !Ref DBName
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      EnablePerformanceInsights: true
      DeletionProtection: false
      
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL — set this as VITE_API_BASE_URL in Amplify
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiGatewayStage}'
  MediaBucket:
    Description: S3 media bucket name
    Value: !Ref MediaBucket
  SQSQueueUrl:
    Description: SQS media analysis queue URL
    Value: !Ref MediaAnalysisQueue
  DatabaseEndpoint:
    Description: RDS PostgreSQL endpoint address
    Value: !GetAtt FloodLensDB.Endpoint.Address
